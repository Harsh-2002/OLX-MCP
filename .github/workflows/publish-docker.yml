name: Publish Docker image

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: publish-docker
  cancel-in-progress: false

env:
  IMAGE: ghcr.io/harsh-2002/olx-mcp

jobs:
  build:
    if: github.ref == 'refs/heads/main'
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
      packages: write
    env:
      ARCH: ${{ matrix.arch }}
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.0.0
        with:
          node-version: 24
          cache: npm
      - uses: docker/setup-buildx-action@v4.4.1
      - run: npm ci
      - run: npm run ci
      - name: Build native runtime image
        run: |
          docker buildx build --platform "linux/$ARCH" --provenance=false \
            --label "org.opencontainers.image.revision=$GITHUB_SHA" \
            --load --tag olx-mcp:publish \
            --metadata-file "$RUNNER_TEMP/loaded.json" .
      - name: Verify native Chromium and MCP before publishing
        run: npm run test:docker -- olx-mcp:publish
      - name: Log in to GHCR
        env:
          REGISTRY_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: printf '%s' "$REGISTRY_TOKEN" | docker login ghcr.io --username "$GITHUB_ACTOR" --password-stdin
      - name: Push the verified platform image by digest
        run: |
          docker buildx build --platform "linux/$ARCH" --provenance=false \
            --label "org.opencontainers.image.revision=$GITHUB_SHA" \
            --output "type=image,name=$IMAGE,push-by-digest=true,name-canonical=true,push=true" \
            --metadata-file "$RUNNER_TEMP/pushed.json" .
          node --input-type=module <<'JS'
          import assert from 'node:assert/strict';
          import { readFileSync, mkdirSync, writeFileSync } from 'node:fs';
          const loaded = JSON.parse(readFileSync(`${process.env.RUNNER_TEMP}/loaded.json`));
          const pushed = JSON.parse(readFileSync(`${process.env.RUNNER_TEMP}/pushed.json`));
          assert.equal(pushed['containerimage.config.digest'], loaded['containerimage.config.digest'], 'Published image must match the tested image');
          const digest = pushed['containerimage.digest'];
          assert.match(digest, /^sha256:[0-9a-f]{64}$/);
          mkdirSync(`${process.env.RUNNER_TEMP}/digests`, { recursive: true });
          writeFileSync(`${process.env.RUNNER_TEMP}/digests/${process.env.ARCH}`, digest);
          JS
      - name: Pull and verify the published platform digest
        run: |
          digest=$(cat "$RUNNER_TEMP/digests/$ARCH")
          docker pull "$IMAGE@$digest"
          npm run test:docker -- "$IMAGE@$digest"
          echo "Verified linux/$ARCH: $IMAGE@$digest" >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v7.0.1
        with:
          name: image-digest-${{ matrix.arch }}
          path: ${{ runner.temp }}/digests/*
          if-no-files-found: error
          retention-days: 1
      - name: Log out of GHCR
        if: always()
        run: docker logout ghcr.io

  publish:
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/download-artifact@v8.0.1
        with:
          pattern: image-digest-*
          path: digests
          merge-multiple: true
      - uses: docker/setup-buildx-action@v4.4.1
      - name: Log in to GHCR
        env:
          REGISTRY_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: printf '%s' "$REGISTRY_TOKEN" | docker login ghcr.io --username "$GITHUB_ACTOR" --password-stdin
      - name: Publish the latest multi-platform manifest
        run: |
          docker buildx imagetools create --tag "$IMAGE:latest" \
            "$IMAGE@$(cat digests/amd64)" "$IMAGE@$(cat digests/arm64)"
          docker buildx imagetools inspect "$IMAGE:latest" --raw > manifest.json
          node --input-type=module <<'JS'
          import assert from 'node:assert/strict';
          import { readFileSync } from 'node:fs';
          const manifest = JSON.parse(readFileSync('manifest.json'));
          assert.equal(manifest.manifests.length, 2);
          for (const arch of ['amd64', 'arm64']) {
            const entry = manifest.manifests.find(item => item.platform.os === 'linux' && item.platform.architecture === arch);
            assert(entry, `Missing linux/${arch}`);
            assert.equal(entry.digest, readFileSync(`digests/${arch}`, 'utf8').trim());
          }
          JS
          docker buildx imagetools inspect "$IMAGE:latest" >> "$GITHUB_STEP_SUMMARY"
      - name: Verify latest is the only published tag
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh api "/users/$GITHUB_REPOSITORY_OWNER/packages/container/olx-mcp/versions" \
            --paginate --jq '.[] | .metadata.container.tags[]' > tags.txt
          test "$(cat tags.txt)" = latest
      - name: Log out of GHCR
        if: always()
        run: docker logout ghcr.io
