name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write
  id-token: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          registry-url: https://registry.npmjs.org
      - run: npm ci
      - name: Verify tag matches package version
        run: test "$GITHUB_REF_NAME" = "v$(node -p "require('./package.json').version")"
      - run: npm run ci
      - name: Pack release
        id: package
        run: |
          PACKAGE_FILE=$(npm pack --silent)
          echo "file=$PACKAGE_FILE" >> "$GITHUB_OUTPUT"
      - name: Verify packaged executable
        env:
          PACKAGE_FILE: ${{ steps.package.outputs.file }}
        run: |
          npm install --global --ignore-scripts "./$PACKAGE_FILE"
          test "$(olx-mcp --version)" = "$(node -p "require('./package.json').version")"
          olx-mcp --help
      - name: Publish verified archive
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          PACKAGE_FILE: ${{ steps.package.outputs.file }}
        run: npm publish "./$PACKAGE_FILE" --provenance --access public --ignore-scripts
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          PACKAGE_FILE: ${{ steps.package.outputs.file }}
        run: gh release create "$GITHUB_REF_NAME" "./$PACKAGE_FILE" --verify-tag --generate-notes
