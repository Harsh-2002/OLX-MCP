name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        node-version: [22, 24]
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.0.0
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm
      - run: npm ci
      - run: npm run ci
      - name: Verify executable
        run: |
          test "$(node bin/olx-mcp-wrapper.js --version)" = "$(node -p "require('./package.json').version")"
          node bin/olx-mcp-wrapper.js --help
      - name: Check package contents
        run: npm pack --dry-run
      - name: Upload coverage
        if: matrix.node-version == 24
        uses: actions/upload-artifact@v7.0.1
        with:
          name: coverage
          path: coverage/

  docker:
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.0.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Build runtime image
        run: docker build --tag olx-mcp:local .
      - name: Check container runtime and MCP
        run: npm run test:docker
